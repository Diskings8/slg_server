syntax = "proto3";
package error_code;
option go_package = "server.slg.com/api/protocol/pb/pb_error_code";

enum ErrorCode {
    NoneErr          = 0;
    ParamError       = 1;
    Failed           = 2;
    ProtocolNotFound = 3;
    SystemBusy       = 4;
    RoleNotFound     = 5;

    ItemTypeNormalDontHave  = 10;
    ItemTypeNormalNotEnough = 11;

    // ── 技能 (20~) ──
    HeroSkillConfNotFound   = 20;  // 技能配置不存在
    HeroSkillMaxLevel       = 21;  // 技能满级
    HeroSkillSlotInvalid    = 22;  // 技能槽无效
    HeroSkillSlotLocked     = 23;  // 技能槽未解锁（等级/觉醒条件不满足）
    HeroSkillSlotOccupied   = 24;  // 技能槽已占用
    HeroSkillSlotEmpty      = 25;  // 技能槽为空
    HeroSkillNotOwned       = 26;  // 未拥有该技能
    HeroSkillEquippedOther  = 27;  // 技能被其他英雄装配
    HeroSkillUseLimitExceed = 28;  // 技能装配次数用尽

    // ── 英雄养成 (30~) ──
    HeroStarFull      = 30;  // 英雄满星
    HeroNoConsumeCard = 31;  // 无同配置可消耗英雄卡

    // ── 道具效果 (40~) ──
    ItemEffectConfNotFound  = 40;  // 道具效果配置不存在
    ItemEffectTargetInvalid = 41;  // 道具效果目标无效

    // ── 技能收藏 (50~) ──
    SkillCollectionConfNotFound = 50;  // 收藏配置不存在
    SkillCollectionUnlocked     = 51;  // 收藏已解锁
    SkillCollectionHeroInvalid  = 52;  // 消耗英雄非收藏所需
    SkillCollectionHeroFull     = 53;  // 该英雄已收集满

    // ── 抽卡 (60~) ──
    RecruitPoolNotFound     = 60;  // 抽卡池不存在
    RecruitTimesInvalid     = 61;  // 抽卡次数非法（非1/10）
    RecruitCostNotEnough    = 62;  // 券/金币不足
    RecruitNotFreeReady     = 63;  // 免费CD未到
    RecruitWishHeroInvalid  = 64;  // 心愿英雄不在可选集合
    RecruitWishNotReady     = 65;  // 心愿进度未满
    RecruitDropConfNotFound = 66;  // 掉落配置缺失

    // ── 货币兑换 (70~) ──
    CurrencyExchangeConfNotFound = 70;  // 兑换规则不存在
    CurrencyExchangeCountInvalid = 71;  // 兑换数量非法（非整组）
}