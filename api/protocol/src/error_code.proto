syntax = "proto3";
package error_code;
option go_package = "server.slg.com/api/protocol/pb/pb_error_code";

enum ErrorCode {
    NoneErr          = 0;
    ParamError       = 1;
    Failed           = 2;
    ProtocolNotFound = 3;
    SystemBusy       = 4;
    RoleNotFound     = 5;

    ItemTypeNormalDontHave  = 10;
    ItemTypeNormalNotEnough = 11;
}