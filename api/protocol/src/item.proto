syntax = "proto3";
package item;
option go_package = "server.slg.com/api/protocol/pb/pb_item";

// ItemChangeLog 道具产销日志
message ItemChangeLog {
    string opt_id       = 1;
    int32 config_id     = 2;  // 道具配置ID
    int32 item_type     = 3;  // 道具大类
    int32 item_sub_type = 4;  // 道具子类
    int64 delta         = 5;  // 变动数量（正=获取，负=消耗）
    int64 balance       = 6;  // 变更后剩余
    string reason       = 7;  // 变动原因（Reason* 常量值）
    uint64 role_id      = 8;  // 角色ID
    int64 timestamp     = 9;  // 发生时间(unix秒)
}

message ItemUse {
    int32 conf_id = 1;  // 配置id
    int64 count   = 2;  // 数量
}

// UseItemReq 使用道具请求
message UseItemReq {
    ItemUse item = 1;  // 道具 + 数量
    oneof target {
        int64 hero_id  = 2;  // 对英雄使用
        int64 build_id = 3;  // 对建筑使用
    }
}

// UseItemResp 使用道具响应
message UseItemResp {
    ItemUse remain = 1;  // 使用后剩余
}

// CurrencyExchangeReq 货币兑换请求（一级→二级）
message CurrencyExchangeReq {
    int32 from_id = 1;  // 来源货币配置ID（一级货币）
    int32 to_id   = 2;  // 目标货币配置ID（二级货币）
    int64 count   = 3;  // 兑换的来源货币数量（需为配置整组倍数的正整数）
}

// CurrencyExchangeResp 货币兑换响应
message CurrencyExchangeResp {
    ItemUse remain = 1;  // 兑换后来源货币剩余
    ItemUse obtain = 2;  // 本次获得的目标货币
}

// ItemListReq 背包查询请求（道具/货币/资源）
message ItemListReq {
}

// ItemListResp 背包查询响应
message ItemListResp {
    repeated ItemUse items = 1;  // 全部道具/货币/资源（按 ConfigID）
}
