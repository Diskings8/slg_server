syntax = "proto3";
package common;
option go_package = "server.slg.com/api/protocol/pb/pb_common";

import "error_code.proto";
import "protocol.proto";

message MessagePacket {
    bytes body                    = 1;
    string dev_msg                = 2;
    error_code.ErrorCode err_code = 3;
}

message NodePacket {
    uint64 role_id        = 1;
    protocol.MsgID msgId  = 2;
    MessagePacket message = 3;
}

message Int32KV {
    int32 Key = 1;
    int32 Val = 2;
}

message CreateRoleReq {
    uint64 roleId   = 1;  // roleID 由 login/account 节点分配
    string roleName = 2;
}

message CreateRoleRsp {
    uint64 roleId = 1;
}

message LoginOnceReq {
    uint64 roleId = 1;
}

message LoginOnceRsp {
    bool result = 1;
}

message NotifyInfoReq {
    string info = 1;
}

message NotifyInfoRsp {
    bool result = 1;
}