syntax = "proto3";
package redis_stream;
option go_package = "server.slg.com/api/protocol/pb/pb_redis_stream";

import "battle.proto";

// ========== 行军事件 ==========

// MarchEventType 行军事件类型
enum MarchEventType {
    MARCH_EVENT_UNKNOWN      = 0;
    MARCH_EVENT_ARRIVED      = 1;  // 行军到达（目标点结算，如占领/采集/驻守）
    MARCH_EVENT_CANCELED     = 2;  // 行军取消
    MARCH_EVENT_BACKARRIVED  = 3;  // 行军回城到站
    MARCH_EVENT_TILE_RELEASED = 4;  // 地块被放弃（释放归属，停止产出）
}

// MarchEvent 行军事件 — worldmap → game，经由 Redis Stream 投递
message MarchEvent {
    MarchEventType type = 1;
    uint64 march_id     = 2;
    uint64 role_id      = 3;
    int32 to_map_id     = 4;  // 仅 ARRIVED 有效
    int32 march_type    = 5;  // 仅 ARRIVED 有效
    int64 ts            = 6;  // unix 时间戳
    int32 state         = 7;  // 结算后行军状态 (pb_maps_march.MarchState): 驻留=6, 回城=5
    MarchBattleResult battle_result = 8;  // 战斗结果（仅攻击行军 ARRIVED 携带）
    battle.TeamInfo team_info = 9;  // 队伍快照（战后存活兵力）；BACKARRIVED 携带供 game 写回 formation
    int32 tile_level   = 10;  // 目标地块结算后等级（开发升级/攻占后；回城/取消为 0）
    int32 tile_element = 11;  // 目标地块元素类型（Resources_1~4；0=非资源）
    uint64 prev_owner  = 12;  // 攻占夺地时的原归属者（>0 且 ≠ role_id 时，game 清理原主资源地快照）
}

// MarchBattleResult 战斗结果（worldmap → game，供经验发放）
message MarchBattleResult {
    bool attacker_win = 1;  // 攻击方是否获胜
    repeated HeroExpItem hero_exp = 2;  // 参战英雄总经验
}

// HeroExpItem 参战英雄经验
message HeroExpItem {
    uint64 hero_id = 1;  // 英雄实例ID
    uint32 exp     = 2;  // 本次获得总经验
}

// ========== 角色进服事件（login → gateway 广播，踢旧连接） ==========

// RoleEnterEvent 角色进服事件 — login EnterServer 成功后发布，所有 gateway 订阅。
// 本机持有该角色旧连接则踢掉（跨 gateway 异设备登录 / 同 gateway 重连双开）。
message RoleEnterEvent {
    uint64 role_id         = 1;  // 进服角色
    uint32 server_id       = 2;  // 进入的区服
    string gateway_node_id = 3;  // 角色所在 gateway 节点标识（login 记录/广播）
}

// ========== 通用 Stream 信封（后续扩展用） ==========

// StreamEnvelope 统一的消息信封
message StreamEnvelope {
    string topic    = 1;  // 主题名，如 "march"
    bytes payload   = 2;  // 业务消息序列化后的 bytes
    int64 timestamp = 3;  // 发布时间戳
}
