syntax = "proto3";
package protocol;
option go_package = "server.slg.com/api/protocol/pb/pb_protocol";

enum MsgID {
    None      = 0;
    Base_Heat = 1;

    Common_Auth = 11;

    // ---------------- Game 业务协议 (1000001~) ----------------//
    GameHeroList         = 1000001;  // 获取英雄列表
    GameHeroUpgradeLevel = 1000002;  // 英雄升级
    GameHeroCultivate    = 1000003;  // 英雄培养(5维属性)
    GameHeroSkillUpgrade = 1000004;  // 英雄技能升级

    GameUseItem            = 1000005;  // 使用道具
    GameMarchCreate        = 1000006;  // 出征创建行军
    GameMapData            = 1000007;  // 查询视野地图数据

    GameFormationField     = 1000008;  // 上阵英雄到编队
    GameFormationRemove    = 1000009;  // 下阵英雄
    GameFormationList      = 1000010;  // 查询编队
    GameBuildingBuild      = 1000011;  // 建造建筑
    GameBuildingList       = 1000012;  // 查询建筑

    GameHeroTroopTransform = 1000013;  // 英雄兵种转化
    GameHeroTroopUnlock    = 1000014;  // 英雄兵种扩展
    GameBattleRecordList   = 1000015;  // 查询战报
    GameHeroEquipSkill     = 1000016;  // 装配技能到英雄技能槽
    GameHeroUnequipSkill   = 1000017;  // 拆卸英雄技能槽技能
    GameHeroUpgradeStar    = 1000018;  // 英雄升星（消耗同配置英雄卡）
    GameHeroSkillCollectionActivate = 1000019;  // 技能收藏激活（消耗道具收集）

    // ---------------- Camera 相机 (42200~) ----------------//
    GameCameraInit         = 42200;  // 相机初始化
    GameCameraMove         = 42202;  // 相机移动

    // ---------------- worldmap 内部服务协议 (5000001~) ----------------//
    WorldMapConnect        = 5000001;  // game→worldmap 流握手

    // ---------------- 推送下推的信息-----------------//
    PushServerMainTain = 10000001;  // 服务器维护
    PushClientVersion  = 10000002;  // 前端版本更新通知
    PushMapInfo        = 11000001;  // 地图信息推送
    PushMarchInfo      = 11000002;  // 行军信息推送
}
