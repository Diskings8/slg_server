syntax = "proto3";
package skill;
option go_package = "server.slg.com/api/protocol/pb/pb_skill";
import "common.proto";
// Skill 技能
message Skill {
    int32 config_id      = 1;  // 配置id
    int32 slot_id        = 2;  // 技能槽位
    int32 level          = 3;  // 技能等级
    int32 research_Level = 4;  // 研究等级
    bool is_unlock       = 5;  // 是否已经解锁
}
message SkillCollection {
    int32 config_id                          = 1;  // 配置id
    repeated common.Int32KV collection_level = 2;  // 收集进度（K=道具配置ID，V=已收集数量）
    bool is_unlock                           = 3;  // 是否已解锁
}

// SkillCollectionActivate 技能收藏激活（分次收集）
//
// 消耗配置指定道具推进收集进度，全部达标后解锁对应技能。
message SkillCollectionActivateReq {
    int32 skill_conf_id = 1;  // 收藏对应技能配置ID
    int32 item_conf_id  = 2;  // 消耗的道具配置ID（须为该收藏配置所需）
    int64 count         = 3;  // 消耗数量
}

message SkillCollectionActivateResp {
    SkillCollection collection = 1;  // 激活后的收藏状态
}