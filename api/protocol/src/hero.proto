syntax = "proto3";
package hero;
option go_package = "server.slg.com/api/protocol/pb/pb_hero";

import "cultivate.proto";
import "skill.proto";
import "equip.proto";

// 英雄状态
enum Status {
    Normal  = 0;
    Injured = 1;
}

// HeroInfo 英雄信息
message HeroInfo {
    int32 config_id                       = 1;   // 配置id
    int32 star_stage                      = 2;   // 星级
    uint32 attr_point                     = 3;   // 属性点
    Status cur_status                     = 4;   // 当前状态
    uint32 cur_level                      = 5;   // 当前等级
    uint32 cur_exp                        = 6;   // 当前经验
    cultivate.Cultivate attr_attack       = 11;  // 攻击属性
    cultivate.Cultivate attr_defense      = 12;  // 防御属性
    cultivate.Cultivate attr_intelligence = 13;  // 智力属性
    cultivate.Cultivate attr_movement     = 14;  // 移动属性
    cultivate.Cultivate attr_relocation   = 15;  // 拆迁属性
    uint32 wage_war_city_id               = 21;  // 征战城市id
    repeated skill.Skill skills           = 22;  // 技能信息
    int32 cur_troop_type_id               = 31;  // 当前兵种类型id
    repeated equip.Troop troops           = 32;  // 所有兵种信息
}

// ---- Game RPC 请求/响应 ----

// HeroList 获取英雄列表
message HeroListReq {
}

message HeroListResp {
    repeated HeroInfo heroes = 1;
}

// HeroUpgradeLevelReq 英雄升级
message HeroUpgradeLevelReq {
    int32  hero_id = 1;
    uint32 exp     = 2;  // 本次获得的经验
}

message HeroUpgradeLevelResp {
    int32  hero_id    = 1;
    uint32 level      = 2;
    uint32 attr_point = 3;  // 升级后的自由属性点
}

// HeroCultivate 英雄培养
message HeroCultivateReq {
    int32 hero_id         = 1;
    uint32 cultivate_type = 2;  // 0:攻击 1:防御 2:智力 3:速度 4:拆迁
}

message HeroCultivateResp {
    int32 hero_id            = 1;
    uint32 cultivate_type    = 2;
    cultivate.Cultivate attr = 3;
    uint32 attr_point        = 4;  // 加点后的剩余自由属性点
}

// HeroTroopTransform 兵种转化（x 等级后选择已解锁派生类型，消耗资源）
message HeroTroopTransformReq {
    int32 hero_id       = 1;
    int32 troop_type_id = 2;  // 目标派生兵种类型
}

message HeroTroopTransformResp {
    int32 hero_id           = 1;
    int32 cur_troop_type_id = 2;  // 转化后的当前兵种
}

// HeroTroopUnlock 扩展兵种（使用道具解锁新的可选派生类型）
message HeroTroopUnlockReq {
    int32 hero_id       = 1;
    int32 troop_type_id = 2;  // 要解锁的派生兵种类型
}

message HeroTroopUnlockResp {
    int32                   hero_id       = 1;
    int32                   troop_type_id = 2;
    repeated equip.Troop    troops        = 3;  // 解锁后的兵种列表
}
