syntax = "proto3";
package hero;
option go_package = "server.slg.com/api/protocol/pb/pb_hero";

import "cultivate.proto";
import "skill.proto";
import "equip.proto";

// 英雄状态
enum Status {
    Normal  = 0;
    Injured = 1;
}

// HeroInfo 英雄信息
message HeroInfo {
    int32 config_id                       = 1;   // 配置id
    int32 star_stage                      = 2;   // 星级
    uint32 attr_point                     = 3;   // 属性点
    Status cur_status                     = 4;   // 当前状态
    uint32 cur_level                      = 5;   // 当前等级
    uint32 cur_exp                        = 6;   // 当前经验
    uint64 hero_id                        = 7;   // 英雄实例ID（经验归属/战斗身份；区别于 config_id 配置ID）
    cultivate.Cultivate attr_attack       = 11;  // 攻击属性
    cultivate.Cultivate attr_defense      = 12;  // 防御属性
    cultivate.Cultivate attr_intelligence = 13;  // 智力属性
    cultivate.Cultivate attr_movement     = 14;  // 移动属性
    cultivate.Cultivate attr_relocation   = 15;  // 拆迁属性
    uint32 wage_war_city_id               = 21;  // 征战城市id
    repeated skill.Skill skills           = 22;  // 技能信息（英雄技能槽，index0=默认技能，1/2=装配槽）
    bool is_awakened                      = 23;  // 是否已觉醒（第三技能槽位解锁条件）
    bool is_locked                        = 24;  // 是否锁定（锁定后不可被消耗，如升星消耗卡）
    int32 cur_troop_type_id               = 31;  // 当前兵种类型id
    repeated equip.Troop troops           = 32;  // 所有兵种信息
    uint32 attack_range                   = 33;  // 攻击距离（能打到"距对方大营 ≤ D"）
    SoldierInfo soldier_info              = 34;  // 兵力状态（兵力上限/当前兵力/伤兵）
}

// SoldierInfo 兵力状态（兵力上限/当前兵力/伤兵）
message SoldierInfo {
    uint32 max_soldier_num = 1;  // 兵力上限
    uint32 cur_alive_num   = 2;  // 当前可用兵力
    uint32 cur_injured_num = 3;  // 当前伤兵
}

// ---- Game RPC 请求/响应 ----

// HeroList 获取英雄列表
message HeroListReq {
}

message HeroListResp {
    repeated HeroInfo heroes = 1;
}

// HeroCultivate 英雄培养
message HeroCultivateReq {
    uint64 hero_id        = 1;
    uint32 cultivate_type = 2;  // 0:攻击 1:防御 2:智力 3:速度 4:拆迁
}

message HeroCultivateResp {
    uint64 hero_id           = 1;
    uint32 cultivate_type    = 2;
    cultivate.Cultivate attr = 3;
    uint32 attr_point        = 4;  // 加点后的剩余自由属性点
}

// HeroTroopTransform 兵种转化（x 等级后选择已解锁派生类型，消耗资源）
message HeroTroopTransformReq {
    uint64 hero_id      = 1;
    int32 troop_type_id = 2;  // 目标派生兵种类型
}

message HeroTroopTransformResp {
    uint64 hero_id          = 1;
    int32 cur_troop_type_id = 2;  // 转化后的当前兵种
}

// HeroTroopUnlock 扩展兵种（使用道具解锁新的可选派生类型）
message HeroTroopUnlockReq {
    uint64 hero_id      = 1;
    int32 troop_type_id = 2;  // 要解锁的派生兵种类型
}

message HeroTroopUnlockResp {
    uint64 hero_id              = 1;
    int32 troop_type_id         = 2;
    repeated equip.Troop troops = 3;  // 解锁后的兵种列表
}

// HeroSkillUpgrade 技能升级
//
// 升级英雄身上（EquipSkills 槽位）的技能等级，消耗道具。不改变技能库(hero_skills)等级。
message HeroSkillUpgradeReq {
    uint64 hero_id = 1;  // 英雄实例ID
    int32 slot_id  = 2;  // 技能槽位（1/2；0=默认技能不可升级）
}

message HeroSkillUpgradeResp {
    skill.Skill skill = 1;  // 升级后的槽位技能（含新 level）
}

// HeroUpgradeStar 英雄升星
//
// 指定待升星英雄，消耗一张与之相同配置（hero_conf_id）的英雄卡，升 1 星。
// 星级上限由服务端常量配置。消耗的英雄卡配置记录进养成消耗记录。
message HeroUpgradeStarReq {
    uint64 hero_id = 1;  // 待升星英雄实例ID
}

message HeroUpgradeStarResp {
    uint64 hero_id   = 1;  // 升星英雄实例ID
    int32 star_stage = 2;  // 升星后星级
}

// HeroLock 锁定英雄：锁定后不可被消耗（升星消耗卡等）
message HeroLockReq {
    uint64 hero_id = 1;
}

message HeroLockResp {
    uint64 hero_id = 1;
    bool is_locked = 2;  // 锁定后 true
}

// HeroUnlock 解锁英雄
message HeroUnlockReq {
    uint64 hero_id = 1;
}

message HeroUnlockResp {
    uint64 hero_id = 1;
    bool is_locked = 2;  // 解锁后 false
}

// HeroEquipSkill 装配技能
//
// 将角色技能库（hero_skills）的技能放入英雄技能槽。装配前校验槽位可用性
// （slot1=英雄等级达标；slot2=等级达标+已觉醒）与技能库状态（存在/未装配他处/装配次数未满）。
message HeroEquipSkillReq {
    uint64 hero_id      = 1;  // 英雄实例ID
    int32 slot_id       = 2;  // 技能槽位（1/2）
    int32 skill_conf_id = 3;  // 技能库技能配置ID
}

message HeroEquipSkillResp {
    repeated skill.Skill skills = 1;  // 装配后的英雄技能槽
}

// HeroUnequipSkill 拆卸技能
//
// 从英雄技能槽移除技能，清空技能库装配记录，按已升级等级返还部分升级资源。
message HeroUnequipSkillReq {
    uint64 hero_id = 1;  // 英雄实例ID
    int32 slot_id  = 2;  // 技能槽位（1/2）
}

message HeroUnequipSkillResp {
    repeated skill.Skill skills = 1;  // 拆卸后的英雄技能槽
    int64 refund_count          = 2;  // 返还的升级道具数量
}
