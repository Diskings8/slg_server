syntax = "proto3";
package pb_worldmap;
option go_package = "server.slg.com/api/protocol/pb/pb_worldmap";

import "camera.proto";
import "common.proto";
import "march.proto";

// WorldMapService 实时流 — 用于相机移动等实时转发
service WorldMapService {
  rpc Stream(stream common.NodePacket) returns (stream common.NodePacket) {}
}

// WorldMapHandler 业务 RPC — game 通过 Unary 调用 worldmap
service WorldMapHandler {
  // 行军
  rpc CreateMarch(CreateMarchReq) returns (CreateMarchRsp);
  rpc CancelMarch(CancelMarchReq) returns (CancelMarchRsp);
  rpc MarchInfo(MarchInfoReq) returns (MarchInfoRsp);

  // 地图
  rpc MapData(MapDataReq) returns (MapDataRsp);
}

// GameEventCallback — worldmap → game 的事件回调，由 game 服务实现
service GameEventCallback {
  // MarchArrived 行军到达目标后回调 game
  rpc MarchArrived(MarchArrivedReq) returns (MarchArrivedRsp);
  // MarchCanceled 行军被取消后回调 game
  rpc MarchCanceled(MarchCanceledReq) returns (MarchCanceledRsp);
}

// ---------- 行军 ----------

message CreateMarchReq {
  uint64 role_id        = 1;
  int32  from_map_id    = 2;
  int32  to_map_id      = 3;
  int32  march_type     = 4;
  uint32 server_id      = 5;  // 出发服务器
  uint32 to_server_id   = 6;  // 目标服务器
  uint64 union_id       = 7;
  repeated uint64 hero_ids = 8;
  uint32 base_speed     = 9;
}

message CreateMarchRsp {
  uint64 march_id  = 1;
  int64  end_time  = 2;  // unix timestamp
}

message CancelMarchReq {
  uint64 role_id  = 1;
  uint64 march_id = 2;
}

message CancelMarchRsp {
}

message MarchInfoReq {
  uint64 march_id = 1;
}

message MarchInfoRsp {
  int32  from_map_id       = 1;
  int32  to_map_id         = 2;
  int32  march_type        = 3;
  maps.march.MarchState state = 4;
  int64  start_time        = 5;
  int64  end_time          = 6;
  uint64 role_id           = 7;
  uint64 union_id          = 8;
}

// MarchArrivedReq worldmap → game：行军到达
message MarchArrivedReq {
  uint64 march_id      = 1;
  uint64 role_id       = 2;
  int32  to_map_id     = 3;
  int32  march_type    = 4;
  // 后续可扩展战斗结果、采集结果等
}

message MarchArrivedRsp {
}

// MarchCanceledReq worldmap → game：行军被取消
message MarchCanceledReq {
  uint64 march_id      = 1;
  uint64 role_id       = 2;
}

message MarchCanceledRsp {
}

// ---------- 地图 ----------

message MapDataReq {
  int32 map_id   = 1;
  int32 range    = 2;
}

// MapDataRsp 直接复用 camera.MapInfo 作为格子数据载体
message MapDataRsp {
  repeated camera.MapInfo map_infos = 1;
}
