syntax = "proto3";
package pb_worldmap;
option go_package = "server.slg.com/api/protocol/pb/pb_worldmap";

import "common.proto";
import "march.proto";
import "battle.proto";

// WorldMapService 实时流 — game→worldmap 的玩家视野流
// 首条消息为握手（MsgID_WorldMapConnect），之后承载相机移动/地图下推
service WorldMapService {
    rpc Stream(stream common.NodePacket) returns (stream common.NodePacket) {
    }
}

// WorldMapHandler 业务 RPC — game 通过 Unary 调用 worldmap
service WorldMapHandler {
    // 行军
    rpc CreateMarch(CreateMarchReq) returns (CreateMarchRsp);
    rpc CancelMarch(CancelMarchReq) returns (CancelMarchRsp);
    rpc MarchInfo(MarchInfoReq) returns (MarchInfoRsp);

    // 地图
    rpc MapData(MapDataReq) returns (MapDataRsp);

    // 角色
    rpc CreateRole(CreateRoleReq) returns (CreateRoleRsp);

    // 审查：在主城 5×5 外圈刷出事件（扫荡行军可处理）
    rpc SpawnReviewEvent(SpawnReviewEventReq) returns (SpawnReviewEventRsp);

    // 审查：气泡点击事件（采集/寻宝），+进度，超 100% 完成
    rpc EventClick(EventClickReq) returns (EventClickRsp);

    // 地块：放弃已占领地块（释放归属，停止产出）
    rpc AbandonTile(AbandonTileReq) returns (AbandonTileRsp);

    // 联盟：角色联盟归属变更同步（game → worldmap 维护 RoleUnionIndex）
    rpc SyncRoleUnion(SyncRoleUnionReq) returns (SyncRoleUnionRsp);
}

// ---------- 行军 ----------

message CreateMarchReq {
    uint64 role_id                          = 1;
    int32 from_map_id                       = 2;
    int32 to_map_id                         = 3;
    int32 march_type                        = 4;
    uint32 server_id                        = 5;  // 出发服务器
    uint32 to_server_id                     = 6;  // 目标服务器
    uint64 union_id                         = 7;
    repeated uint64 hero_ids                = 8;
    uint32 base_speed                       = 9;
    repeated battle.TeamSlotInfo team_slots = 10;  // 出征队伍（英雄+士兵）
}

message CreateMarchRsp {
    uint64 march_id = 1;
    int64 end_time  = 2;  // unix timestamp
}

message CancelMarchReq {
    uint64 role_id  = 1;
    uint64 march_id = 2;
}

message CancelMarchRsp {
}

message MarchInfoReq {
    uint64 march_id = 1;
}

message MarchInfoRsp {
    int32 from_map_id           = 1;
    int32 to_map_id             = 2;
    int32 march_type            = 3;
    maps.march.MarchState state = 4;
    int64 start_time            = 5;
    int64 end_time              = 6;
    uint64 role_id              = 7;
    uint64 union_id             = 8;
}

// ---------- 地图 ----------

message MapDataReq {
    int32 map_id = 1;
    int32 range  = 2;
}

message MapDataRsp {
    repeated MapCellInfo cells  = 1;  // 视野内地块
    repeated MarchBrief marches = 2;  // 视野内行军
}

// MapCellInfo 地图格子数据
message MapCellInfo {
    int32 map_id       = 1;
    int32 element_type = 2;  // 元素类型（cores ElementType）
    uint32 element_id  = 3;  // 配置ID
    int32 level        = 4;
    uint64 owner_id    = 5;  // 归属角色ID，0=无主
    uint32 server_id   = 6;  // 所属服务器
}

// MarchBrief 视野内行军简况
message MarchBrief {
    uint64 march_id             = 1;
    int32 from_map_id           = 2;
    int32 to_map_id             = 3;
    uint64 from_role_id         = 4;  // 出征角色
    int32 march_type            = 5;
    maps.march.MarchState state = 6;
    int64 end_time              = 7;  // 到达时间
}

// WorldMapConnectReq game→worldmap 建立连接的握手消息（首条 NodePacket.message.body）
message WorldMapConnectReq {
    int32 map_id = 1;  // 玩家所在地图ID（主城位置）
}

// ---------- 角色 ----------

// CreateRoleReq 创建角色主城（分配出生点并落主城）
message CreateRoleReq {
    uint64 role_id   = 1;  // 角色ID
    uint32 server_id = 2;  // 所在区服
    string role_name = 3;  // 角色名（写入 cores RoleBrief）
}

// CreateRoleRsp 创建结果
message CreateRoleRsp {
    int32 map_id = 1;  // 主城核心格 MapID
}

// ---------- 审查刷事件 ----------

// SpawnReviewEventReq 审查任务在主城周围刷出事件
message SpawnReviewEventReq {
    uint64 role_id     = 1;  // 角色ID
    int32  core_map_id = 2;  // 主城核心格 MapID
    int32  event_type  = 3;  // 事件类型（map_events.EventType）
}

// SpawnReviewEventRsp 刷事件结果
message SpawnReviewEventRsp {
    int32 map_id = 1;  // 刷出事件的地图ID（0=未找到合适位置）
}

// EventClickReq 气泡点击事件（采集/寻宝）
message EventClickReq {
    uint64 role_id = 1;
    int32  map_id  = 2;
}

// EventClickRsp 点击结果
message EventClickRsp {
    int32 progress   = 1;  // 点击后进度 0~100+
    bool  completed  = 2;  // 是否完成（超 100%）
    int32 event_type = 3;  // 完成时返回事件类型（游戏侧按类型发奖）
}

// ---------- 地块放弃 ----------

// AbandonTileReq 放弃已占领地块
message AbandonTileReq {
    uint64 role_id = 1;  // 放弃者角色ID
    int32  map_id  = 2;  // 目标地块
}

// AbandonTileRsp 放弃结果
message AbandonTileRsp {
}

// ---------- 联盟索引同步 ----------

// SyncRoleUnionReq 角色联盟归属变更
message SyncRoleUnionReq {
    uint64 role_id  = 1;
    uint64 union_id = 2;  // 0=退出/被踢/解散（移除索引）
}

// SyncRoleUnionRsp 同步结果
message SyncRoleUnionRsp {
}