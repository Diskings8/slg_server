syntax = "proto3";
package pb_game;
option go_package = "server.slg.com/api/protocol/pb/pb_game";

import "common.proto";

service GameService {
    rpc Stream(stream GameServiceNodePacketReq) returns (stream GameServiceNodePacketRsp) {}
}

service GameHandler {
    // 登录服创建玩家
    rpc CreateRole(common.CreateRoleReq) returns (common.CreateRoleRsp);
    rpc LoginOnce(common.LoginOnceReq) returns (common.LoginOnceRsp);
}


message GameServiceNodePacketReq {
    uint64 roleId            = 1;
    common.NodePacket packet = 2;
}

message GameServiceNodePacketRsp {
    common.NodePacket packet = 1;
}

